# TradeOS stack — Edgedepth Terminal + community gateway.
#
#   docker compose up
#   open http://localhost:8080
#
# No API key, no account. The gateway bridges Binance public streams.
#
# To compile the terminal WASM from source instead of pulling prebuilt images:
#   docker compose up --build

services:
  gateway:
    image: ghcr.io/edgedepthhq/edgedepth-gateway:latest
    build: https://github.com/edgedepthhq/edgedepth-gateway.git
    container_name: tradeos-gateway
    ports:
      - "9001:8080"
    environment:
      EDGEDEPTH_ADDR: ":8080"
      EDGEDEPTH_LOG: "info"
      # Set to "aggTrade" if the tape stays empty while the book updates (some
      # networks don't serve Binance's @trade stream).
      BINANCE_TRADE_STREAM: "aggTrade"
    restart: unless-stopped

  terminal:
    image: ghcr.io/edgedepthhq/edgedepth-terminal:latest
    build:
      context: terminal
      dockerfile: Dockerfile
    container_name: tradeos-terminal
    ports:
      - "8080:8080"
    environment:
      # Resolved by YOUR BROWSER (not this container), so must be a host-visible
      # address — Docker-internal "gateway" DNS won't work from the browser.
      EDGEDEPTH_WS_URL: "ws://localhost:9001/ws"
    depends_on:
      - gateway
    restart: unless-stopped
