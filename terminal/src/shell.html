<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeOS Terminal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%230E1116'/><rect x='18' y='36' width='28' height='3' rx='1.2' fill='%2314181D'/><rect x='21' y='41' width='22' height='3' rx='1.2' fill='%2314181D'/><line x1='32' y1='15' x2='32' y2='47' stroke='%23C9A227' stroke-width='2.4' stroke-linecap='round'/><rect x='27.5' y='29' width='9' height='13' rx='1.8' fill='%23C9A227'/><path d='M15.2 45.8 A20 20 0 1 1 48.8 45.8' fill='none' stroke='%2314181D' stroke-width='4.5' stroke-linecap='round'/></svg>">
    <meta name="theme-color" content="#0E1116">
    <script src="coi-serviceworker.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0E1116;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #C9A227;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 11px;
            background: rgba(20,24,29,0.92);
            border: 1px solid rgba(201,162,39,0.22);
            padding: 7px 11px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Initializing...</div>

<script type='text/javascript'>
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
        (e.metaKey && e.altKey && e.keyCode === 73)) {
            e.stopPropagation();
            return true;
        }
    }, true);

    var Module = {
        locateFile: function(path) {
            return '/' + path;
        },
        preRun: [],
        postRun: [],
        print: function(text) {
            console.log(text);
        },
        printErr: function(text) {
            console.error(text);
        },
        canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) {
                alert('WebGL context lost. Please reload.');
                e.preventDefault();
            }, false);
            return canvas;
        })(),
        setStatus: function(text) {
            var statusDiv = document.getElementById('status');
            if (!statusDiv) return;
            // Hide once the app is actually running - the runtime emits
            // 'Running...' after onRuntimeInitialized, so without this the
            // badge lingers over the terminal forever.
            if (!text || /Running/.test(text)) {
                statusDiv.style.display = 'none';
                return;
            }
            statusDiv.textContent = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            Module.setStatus(left ? 'Preparing (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Ready');
        }
    };
    Module.setStatus('Downloading');
    document.getElementById('canvas').addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
</script>

{{{ SCRIPT }}}

<script type='text/javascript'>
    Module.onRuntimeInitialized = function() {
        var canvas = Module.canvas;
        window.addEventListener('resize', function() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            var dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
        });
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        var statusDiv = document.getElementById('status');
        if (statusDiv) {
            statusDiv.textContent = 'Ready';
            setTimeout(function() {
                statusDiv.style.display = 'none';
            }, 2000);
        }
    };
</script>
</body>
</html>
